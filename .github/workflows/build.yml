name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: vhdxbackup-msvc
          path: build/Release/vhdxbackup.exe

  mingw:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix
      - name: Build
        run: ./build-mingw.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vhdxbackup-mingw
          path: build/vhdxbackup.exe
